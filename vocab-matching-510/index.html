<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary Matching Practice</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--text:#1f2430;--muted:#6a7080;--border:#d9d5cb;--accent:#2f6fed;--accent-bg:#e6eeff;--ok:#1d8a4e;--ok-bg:#dff3e6;--bad:#c0392b;--bad-bg:#fbe2df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#15171c;--surface:#1f232b;--text:#eceef3;--muted:#9aa1b0;--border:#363c48;--accent:#7aa2ff;--accent-bg:#26324f;--ok:#5fd08a;--ok-bg:#1d3a2a;--bad:#ff8a7d;--bad-bg:#432622}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#15171c;--surface:#1f232b;--text:#eceef3;--muted:#9aa1b0;--border:#363c48;--accent:#7aa2ff;--accent-bg:#26324f;--ok:#5fd08a;--ok-bg:#1d3a2a;--bad:#ff8a7d;--bad-bg:#432622}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 8px}
p.directions{font-size:.95rem;margin:0 0 16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.score{font-weight:600}
button.reset,button.print{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.cols{display:grid;grid-template-columns:200px 1fr;gap:16px}
.col{display:flex;flex-direction:column;gap:8px}
h2.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.item{background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.term{font-weight:600}
.item:hover:not(:disabled){border-color:var(--accent)}
.item.sel{border-color:var(--accent);background:var(--accent-bg)}
.item.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
/* Text feedback so color isn't the only cue */
.fb{display:inline-block;margin-left:8px;font-size:.8rem;font-weight:700;white-space:nowrap}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
/* Matched pairs area: each pair sits on its own row */
.matched{margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:200px 1fr;gap:16px}
.defcell{display:flex;flex-direction:column}
.defcell .item{width:100%}
/* Example sentence, linked to its definition by a dotted elbow line */
.ex{position:relative;margin:0 0 4px 22px;padding:8px 10px 2px 20px;color:var(--text);animation:exIn .35s ease-out}
.ex::before{content:"";position:absolute;left:0;top:0;width:14px;height:20px;border-left:2px dotted var(--ok);border-bottom:2px dotted var(--ok);border-bottom-left-radius:6px}
.ex-label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok);margin-right:6px}
.ex-text{font-style:italic}
.ex-text strong{font-style:normal}
@keyframes exIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ex{animation:none}}
@media (max-width:640px){.cols,.pair{grid-template-columns:1fr}.pair{gap:4px}}
.done{display:none;margin-top:18px;padding:14px;border-radius:10px;background:var(--ok-bg);border:2px solid var(--ok);font-weight:600}
/* Study sheet */
.study{margin-top:18px;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:16px}
.study-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.study h2{font-size:1.15rem;margin:0}
.study table{width:100%;border-collapse:collapse}
.study th,.study td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--border)}
.study th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.study td:first-child{font-weight:600;width:140px}
.study td:nth-child(2){width:38%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
/* Print: only the study sheet, in plain black and white */
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  main>*:not(#study){display:none!important}
  .study{display:block!important;border:0;padding:0;background:#fff}
  .study button{display:none}
  .study th,.study td{border-bottom:1px solid #999;color:#000}
  .study tr{break-inside:avoid}
}
</style>
</head>
<body>
<main>
<h1>Vocabulary Matching Practice</h1>
<p class="sub">Parts of the Body</p>
<p class="sub directions">Click a word, then click its matching definition.</p>
<div class="bar"><div class="score" id="score">Matched: 0 / 12 · Mistakes: 0</div><button class="reset" id="reset">Shuffle &amp; restart</button></div>

<section id="matchedWrap" hidden="" aria-labelledby="matchedLabel">
  <h2 class="label" id="matchedLabel" style="margin-bottom:8px">Matched pairs</h2>
  <div class="matched" id="pairs"></div>
</section>

<div class="cols" id="cols">
  <div class="col"><h2 class="label">Words</h2><div class="col" id="terms"></div></div>
  <div class="col"><h2 class="label">Definitions</h2><div class="col" id="defs"></div></div>
</div>

<div class="done" id="done" style="display: none;"></div>

<section class="study" id="study" hidden="" aria-labelledby="studyTitle">
  <div class="study-head">
    <h2 id="studyTitle">Study Sheet: Parts of the Body (HW-2)</h2>
    <button class="print" id="print">Print study sheet</button>
  </div>
  <table>
    <thead><tr><th scope="col">Word</th><th scope="col">Definition</th><th scope="col">Example</th></tr></thead>
    <tbody id="studyBody"></tbody>
  </table>
</section>

<div id="live" class="sr-only" aria-live="polite"></div>
</main>
<script>
/* [word, definition, example] — in examples, *asterisks* mark the word so it can be bolded */
var DATA=[
["finger","a long part of the hand used for holding things","My hand has five (5) *fingers*."],
["ankle","the joint between the foot and the leg","If you wear high heeled shoes, you might twist your *ankle*."],
["leg","a long part of the lower body used for standing and walking","Her *legs* are strong because she likes to run."],
["knee","the joint at the middle of the leg","When you sit on a chair, you bend your *knees*."],
["eye","the part of the face that a person uses to see","On a sunny day, I protect my *eyes* with sunglasses."],
["toe","one of the small parts at the end of the foot","My foot has five (5) *toes*."],
["stomach","the part of the body where food goes when a person eats","If I eat too much, my *stomach* will hurt."],
["arm","a long part of the upper body used for lifting and holding things","He can lift the box with his strong *arms*."],
["ear","the part of the head that a person uses for hearing","The music is too loud for my *ears*."],
["shoulder","the joint between the arm and the upper body","The little boy is up high on his father's *shoulders*."],
["tooth","a hard white part inside the mouth used for biting and chewing","It is important to brush your *teeth* and keep them clean."],
["back","the rear part of the body, below the neck and above the hips","When I stand all day, my *back* hurts."]
];
var TOTAL=DATA.length,sel=null,matched=0,mistakes=0;
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function announce(msg){var l=$('live');l.textContent='';setTimeout(function(){l.textContent=msg},50)}

function build(){
  sel=null;matched=0;mistakes=0;
  $('done').style.display='none';
  $('study').hidden=true;
  $('matchedWrap').hidden=true;
  $('cols').hidden=false;
  $('pairs').innerHTML='';
  var t=$('terms'),d=$('defs');
  t.innerHTML='';d.innerHTML='';
  shuffle(DATA.map(function(_,i){return i})).forEach(function(i){
    var b=document.createElement('button');b.className='item term';b.textContent=DATA[i][0];b.dataset.i=i;b.onclick=function(){pickTerm(b)};t.appendChild(b)});
  shuffle(DATA.map(function(_,i){return i})).forEach(function(i){
    var b=document.createElement('button');b.className='item';b.textContent=DATA[i][1];b.dataset.i=i;b.onclick=function(){pickDef(b)};d.appendChild(b)});
  update();
}
function update(){$('score').textContent='Matched: '+matched+' / '+TOTAL+' · Mistakes: '+mistakes}

function clearFb(b){
  var f=b.querySelector('.fb');if(f)f.remove();
  b.classList.remove('bad');
  if(b._t){clearTimeout(b._t);b._t=null}
}
function addFb(b,text,kind){
  var s=document.createElement('span');s.className='fb '+kind;s.textContent=text;b.appendChild(s);
}

/* Turn "text *word* text" into text nodes with the word in <strong> */
function fillSentence(el,s){
  s.split('*').forEach(function(part,k){
    if(!part)return;
    if(k%2){var st=document.createElement('strong');st.textContent=part;el.appendChild(st)}
    else el.appendChild(document.createTextNode(part));
  });
}
function makeExample(i){
  var ex=document.createElement('p');ex.className='ex';
  var lab=document.createElement('span');lab.className='ex-label';lab.textContent='Example:';
  var txt=document.createElement('span');txt.className='ex-text';fillSentence(txt,DATA[i][2]);
  ex.appendChild(lab);ex.appendChild(txt);
  return ex;
}

function pickTerm(b){
  if(b.classList.contains('ok'))return;
  if(sel)sel.classList.remove('sel');
  sel=b;b.classList.add('sel');
}
function pickDef(b){
  if(!sel||b.classList.contains('ok'))return;
  clearFb(b);
  if(sel.dataset.i===b.dataset.i){
    var term=sel;
    term.classList.remove('sel');term.classList.add('ok');b.classList.add('ok');
    term.disabled=true;b.disabled=true;
    addFb(b,'Correct!','ok');
    // Move the pair into the matched area, side by side on one row
    var row=document.createElement('div');row.className='pair';
    var cell=document.createElement('div');cell.className='defcell';
    cell.appendChild(b);cell.appendChild(makeExample(term.dataset.i));
    row.appendChild(term);row.appendChild(cell);
    $('pairs').appendChild(row);
    $('matchedWrap').hidden=false;
    sel=null;matched++;update();
    announce('Correct! '+DATA[term.dataset.i][0]+' matched. Example: '+DATA[term.dataset.i][2].replace(/\*/g,''));
    if(matched===TOTAL){finish()}
    else{var next=$('terms').querySelector('.item');if(next)next.focus()}
  }else{
    mistakes++;update();
    b.classList.add('bad');
    addFb(b,'Incorrect','bad');
    announce('Incorrect. Try again.');
    b._t=setTimeout(function(){clearFb(b)},1500);
  }
}

function finish(){
  $('cols').hidden=true;
  var m=$('done');m.style.display='block';
  m.textContent=mistakes===0?'Perfect! All '+TOTAL+' matched with no mistakes. 🎉':'Well done! All '+TOTAL+' matched with '+mistakes+' mistake'+(mistakes===1?'':'s')+'. Try again for a perfect score!';
  var body=$('studyBody');body.innerHTML='';
  DATA.forEach(function(p){
    var tr=document.createElement('tr'),a=document.createElement('td'),c=document.createElement('td'),e=document.createElement('td');
    a.textContent=p[0];c.textContent=p[1];e.className='ex-text';fillSentence(e,p[2]);
    tr.appendChild(a);tr.appendChild(c);tr.appendChild(e);body.appendChild(tr);
  });
  $('study').hidden=false;
  announce(m.textContent+' A printable study sheet is now available.');
  $('print').focus();
}

$('print').onclick=function(){try{window.print()}catch(e){}};
$('reset').onclick=build;
build();
</script>

</body>
</html>
